[package]
name = "trustpass-core"
version = "0.1.0"
edition = "2021"
description = "TrustPass cryptographic core: W3C VC-DM, BBS+ selective disclosure, generic predicate engine, and Noir ZK integration"

[dependencies]
# Cryptography (DockNetwork BBS+ and Arkworks BLS12-381)
bbs_plus = { version = "0.25.0", default-features = false, features = ["std"] }
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = { version = "0.4", features = ["derive"] }
ark-std = { version = "0.4", features = ["std"] }
dock_crypto_utils = { version = "0.23.0", default-features = false, features = ["std"] }
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"

# Multibase & Multicodec for did:key (pure Rust, no ledger)
bs58 = "0.5"
hex = "0.4"

# Serialization & Core Types
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"

# Optional gRPC integration
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
tokio = { version = "1.38", features = ["full"], optional = true }

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }

[features]
default = []
grpc = ["dep:tonic", "dep:prost", "dep:tokio"]
